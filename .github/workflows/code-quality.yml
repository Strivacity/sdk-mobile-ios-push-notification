name: Code Quality

on:
  pull_request:
    branches:
      - main

jobs:
  swiftformat:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # SwiftFormat is preinstalled on GitHub's macOS runner images.
      - name: Run SwiftFormat check
        run: swiftformat --lint .

  swiftlint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint .
